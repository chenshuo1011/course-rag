<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>课程题库 · 教材问答</title>
<style>
  :root {
    --bg: #fafaf7; --card: #fff; --line: #e5e3dc; --text: #1f1e1c;
    --muted: #6b6a64; --blue: #185fa5; --blue-bg: #e6f1fb;
    --amber: #8a5a00; --amber-bg: #fdf3dd;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 30px 20px 70px; background: var(--bg); color: var(--text);
    font: 15px/1.75 system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 6px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0; }
  h1 small { font-weight: 400; color: var(--muted); font-size: 13px; margin-left: 8px; }
  .hint { color: var(--muted); font-size: 13px; }
  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 20px 22px; margin-bottom: 12px; }
  .qbar { display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1; font: inherit; resize: none; padding: 11px 14px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: inherit; line-height: 1.6;
  }
  textarea:focus { outline: none; border-color: var(--blue); background: #fff; }
  button { font: inherit; cursor: pointer; }
  button.send {
    border-radius: 10px; padding: 11px 20px; border: 1px solid var(--blue);
    background: var(--blue); color: #fff; white-space: nowrap;
  }
  button.send:disabled { opacity: .45; cursor: not-allowed; }
  .samples { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .samples button {
    font-size: 13px; color: var(--muted); background: #fff;
    border: 1px solid var(--line); border-radius: 999px; padding: 5px 13px;
  }
  .samples button:hover { border-color: #b9b7ae; color: var(--text); }
  .answer { font-size: 15.5px; line-height: 1.85; white-space: pre-wrap; }
  .timing { color: var(--muted); font-size: 12.5px; margin-top: 14px; display: flex; gap: 14px; flex-wrap: wrap; }
  .cite {
    border-left: 3px solid var(--line); padding: 10px 0 10px 14px; margin-bottom: 14px;
  }
  .cite:last-child { margin-bottom: 0; }
  .cite .sec { font-size: 13.5px; font-weight: 600; margin-bottom: 4px; }
  .cite .score { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 8px; }
  .cite .txt { font-size: 13.5px; color: #4a4944; line-height: 1.7; }
  .warn {
    background: var(--amber-bg); border: 1px solid #f0dcb0; color: var(--amber);
    border-radius: 8px; padding: 10px 14px; font-size: 13.5px; margin-bottom: 14px;
  }
  .loading { color: var(--muted); font-size: 13.5px; }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; font-size: 14px; }
  h2 { font-size: 14px; font-weight: 600; margin: 0 0 14px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>教材问答<small>答完给引用，可以自己核对</small></h1>
    <span class="hint">
      <a href="/">去答题</a> ·
      <a href="/review">错题复习</a> ·
      <a href="/chat">题库问答</a>
    </span>
  </header>
  <div class="sub" id="status">检查模型状态…</div>

  <div class="card">
    <div class="qbar">
      <textarea id="q" rows="2" placeholder="问教材里的内容，比如：什么是朴素唯物主义自然观"></textarea>
      <button class="send" id="send">提问</button>
    </div>
    <div class="samples">
      <button>什么是朴素唯物主义自然观</button>
      <button>系统自然观的核心观点是什么</button>
      <button>马克思主义自然观是怎么形成的</button>
      <button>第谷用什么工具观测天体</button>
    </div>
  </div>

  <div id="out"><div class="card empty">答案和引用会出现在这里</div></div>
</div>

<script>
const $ = s => document.querySelector(s);
const out = $('#out');
const box = $('#q');
const sendBtn = $('#send');
let ready = false, busy = false;

async function api(path, opt) {
  const r = await fetch(path, opt);
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.detail || ('HTTP ' + r.status));
  return d;
}

// 后台在加载 278M 的重排模型，先告诉用户为什么按钮是灰的
async function poll() {
  try {
    const s = await api('/doc/status');
    ready = s.ready;
    if (ready) {
      $('#status').textContent = '模型就绪 · 教材 10.2 万字，切片 240 块';
      sendBtn.disabled = false;
    } else {
      $('#status').textContent = '模型加载中（约 30 秒，第一次启动才有）…';
      setTimeout(poll, 2000);
    }
  } catch (e) {
    $('#status').textContent = '服务未连接：' + e.message;
    setTimeout(poll, 3000);
  }
}

async function ask(text) {
  if (busy || !ready) return;
  busy = true; sendBtn.disabled = true;
  out.innerHTML = '<div class="card"><div class="loading">检索中…（重排约 2 秒）</div></div>';

  try {
    const r = await api('/doc/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ q: text })
    });

    out.innerHTML = '';

    if (r.rewrite) {
      const w = document.createElement('div');
      w.className = 'warn';
      w.textContent = `你的问法偏口语，检索时自动改写成了：${r.rewrite}`;
      out.appendChild(w);
    }

    if (r.low_confidence) {
      const w = document.createElement('div');
      w.className = 'warn';
      w.textContent = '检索到的段落与这个问题匹配度较低，下面的回答可能不准确，请对照引用自己判断。';
      out.appendChild(w);
    }

    const c1 = document.createElement('div');
    c1.className = 'card';
    const h = document.createElement('h2');
    h.textContent = '答案';
    const a = document.createElement('div');
    a.className = 'answer';
    a.textContent = r.answer;                 // 不拼 HTML，回答里可能有尖括号
    const t = document.createElement('div');
    t.className = 'timing';
    const tt = r.timings;
    t.innerHTML = `<span>检索 ${tt.retrieve_ms}ms</span><span>重排 ${tt.rerank_ms}ms</span>`
                + `<span>生成 ${tt.gen_ms}ms</span><span>合计 ${(r.total_ms/1000).toFixed(1)}s</span>`;
    c1.append(h, a, t);
    out.appendChild(c1);

    const c2 = document.createElement('div');
    c2.className = 'card';
    const h2 = document.createElement('h2');
    h2.textContent = '引用的原文';
    c2.appendChild(h2);
    r.citations.forEach(c => {
      const d = document.createElement('div');
      d.className = 'cite';
      const sec = document.createElement('div');
      sec.className = 'sec';
      sec.textContent = `［片段${c.n}］${c.section}`;
      const sc = document.createElement('span');
      sc.className = 'score';
      sc.textContent = `相关度 ${c.score}`;
      sec.appendChild(sc);
      const txt = document.createElement('div');
      txt.className = 'txt';
      txt.textContent = c.snippet;
      d.append(sec, txt);
      c2.appendChild(d);
    });
    out.appendChild(c2);
  } catch (e) {
    out.innerHTML = `<div class="card"><div class="warn">出错：${e.message}</div></div>`;
  } finally {
    busy = false; sendBtn.disabled = !ready;
    box.focus();
  }
}

sendBtn.disabled = true;
sendBtn.onclick = () => { const t = box.value.trim(); if (t) ask(t); };
box.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); sendBtn.click(); }
});
document.querySelectorAll('.samples button').forEach(b => {
  b.onclick = () => { box.value = b.textContent; ask(b.textContent); };
});
poll();
box.focus();
</script>
</body>
</html>
