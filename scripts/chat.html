<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>课程题库 · 问答</title>
<style>
  :root {
    --bg: #fafaf7; --card: #fff; --line: #e5e3dc; --text: #1f1e1c;
    --muted: #6b6a64; --blue: #185fa5; --blue-bg: #e6f1fb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.75 system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
    padding: 18px 22px; border-bottom: 1px solid var(--line); background: #fff;
  }
  h1 { font-size: 17px; font-weight: 600; margin: 0; }
  h1 small { font-weight: 400; color: var(--muted); font-size: 13px; margin-left: 8px; }
  .hint { color: var(--muted); font-size: 13px; }
  a { color: var(--blue); text-decoration: none; font-size: 13.5px; }
  a:hover { text-decoration: underline; }
  main { flex: 1; overflow-y: auto; padding: 26px 22px 12px; }
  .wrap { max-width: 720px; margin: 0 auto; }
  .msg { margin-bottom: 20px; display: flex; flex-direction: column; }
  .msg.me { align-items: flex-end; }
  .bubble {
    max-width: 88%; padding: 12px 16px; border-radius: 12px;
    white-space: pre-wrap; word-break: break-word;
  }
  .me .bubble { background: var(--blue); color: #fff; border-bottom-right-radius: 4px; }
  .bot .bubble { background: #fff; border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .bot .bubble.busy { color: var(--muted); font-style: normal; }
  .bot .bubble.busy::after { content: '…'; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0%,25% { content: ''; } 50% { content: '.'; } 75% { content: '..'; } 100% { content: '...'; } }
  .foot { color: var(--muted); font-size: 12px; margin-top: 6px; display: flex; gap: 12px; flex-wrap: wrap; }
  .tag { background: #f1efe8; border-radius: 4px; padding: 0 6px; }
  .samples { max-width: 720px; margin: 0 auto 14px; display: flex; gap: 8px; flex-wrap: wrap; }
  .samples button {
    font: inherit; font-size: 13px; cursor: pointer; color: var(--muted);
    background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 5px 13px;
  }
  .samples button:hover { border-color: #b9b7ae; color: var(--text); }
  footer { border-top: 1px solid var(--line); background: #fff; padding: 14px 22px 18px; }
  .bar { max-width: 720px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1; font: inherit; resize: none; padding: 11px 14px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: inherit;
    line-height: 1.6; max-height: 140px;
  }
  textarea:focus { outline: none; border-color: var(--blue); background: #fff; }
  button.send {
    font: inherit; cursor: pointer; border-radius: 10px; padding: 11px 20px;
    border: 1px solid var(--blue); background: var(--blue); color: #fff; white-space: nowrap;
  }
  button.send:disabled { opacity: .45; cursor: not-allowed; }
  .err { color: #a32b21; }
</style>
</head>
<body>
  <header>
    <h1>课程题库 · 问答<small>口语提问，答不出会说没有</small></h1>
    <span class="hint">
      <span id="conn">连接中…</span> ·
      <a href="/">去答题 →</a>
    </span>
  </header>

  <main id="scroll">
    <div class="wrap" id="list"></div>
  </main>

  <footer>
    <div class="samples">
      <button>第三讲有多少道判断题</button>
      <button>哪几讲提到了盖伦</button>
      <button>第谷接受的是哪种学说</button>
      <button>红烧肉怎么做</button>
    </div>
    <div class="bar">
      <textarea id="q" rows="1" placeholder="用大白话问，比如：这门课讲什么"></textarea>
      <button class="send" id="send">发送</button>
    </div>
  </footer>

<script>
const $ = s => document.querySelector(s);
const list = $('#list');
const box = $('#q');
const sendBtn = $('#send');
let busy = false;

function add(text, who, meta) {
  const m = document.createElement('div');
  m.className = 'msg ' + who;
  const b = document.createElement('div');
  b.className = 'bubble';
  b.textContent = text;
  m.appendChild(b);
  if (meta) {
    const f = document.createElement('div');
    f.className = 'foot';
    f.innerHTML = meta;
    m.appendChild(f);
  }
  list.appendChild(m);          // 直接文本节点，不拼 HTML——回答里可能有尖括号
  $('#scroll').scrollTop = $('#scroll').scrollHeight;
  return { m, b };
}

async function ask(text) {
  if (busy) return;
  busy = true; sendBtn.disabled = true;
  add(text, 'me');

  const { b } = add('正在查题库', 'bot');
  b.classList.add('busy');

  try {
    const t0 = performance.now();
    const r = await fetch('/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ q: text })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || ('HTTP ' + r.status));
    const wall = Math.round(performance.now() - t0);

    b.classList.remove('busy');
    b.textContent = d.answer || '（空回答）';

    const tags = [];
    if (d.tools && d.tools.length) tags.push(`<span class="tag">${d.tools.join(' → ')}</span>`);
    if (d.stop === 'fallback') tags.push('<span class="tag">降级：模型超时</span>');
    tags.push(`${(d.elapsed_ms / 1000).toFixed(1)}s（端到端 ${(wall / 1000).toFixed(1)}s）`);
    tags.push(`${d.tokens} tokens`);
    const f = document.createElement('div');
    f.className = 'foot';
    f.innerHTML = tags.join('<span>·</span>');
    b.parentElement.appendChild(f);
  } catch (e) {
    b.classList.remove('busy');
    b.innerHTML = `<span class="err">出错：${e.message}</span>`;
  } finally {
    busy = false; sendBtn.disabled = false;
    $('#scroll').scrollTop = $('#scroll').scrollHeight;
    box.focus();
  }
}

function send() {
  const t = box.value.trim();
  if (!t) return;
  box.value = ''; box.style.height = 'auto';
  ask(t);
}

sendBtn.onclick = send;
box.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
box.addEventListener('input', () => {
  box.style.height = 'auto';
  box.style.height = Math.min(box.scrollHeight, 140) + 'px';
});
document.querySelectorAll('.samples button').forEach(el => {
  el.onclick = () => { box.value = el.textContent; send(); };
});

fetch('/health').then(r => r.json())
  .then(h => $('#conn').textContent = `已连接 · ${h.questions} 题`)
  .catch(() => $('#conn').textContent = '未连接');

add('直接问就行。题库里没有的会明确说没有，不会编。', 'bot');
box.focus();
</script>
</body>
</html>
